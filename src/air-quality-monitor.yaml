esphome:
  name: air-monitor-esphome
  friendly_name: Air Monitor
  project:
    name: daedalus-labs.air-monitor
    version: "1.0.0"
  on_boot:
    then:
      # Read the RTC time once when the system boots
      pcf8523.read_time:

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf

# Configuration variables
substitutions:
  display_name: "First Floor Air Monitor"
  sensor_update_time: 30s
  wifi_update_time: 60s

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  safe_mode: true
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${display_name}"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

external_components:
  - source:
      type: git
      url: https://github.com/daedalus-labs/dfrobot_sen0466.git
    components: [sen0466]

  - source:
      type: git
      url: https://github.com/daedalus-labs/esphome-pcf8523.git 
    components: [pcf8523]

i2c:
  - id: main_i2c
    sda: GPIO21
    scl: GPIO22
    scan: true

switch:
  - platform: restart
    name: ${display_name} Restart

time:
  - platform: pcf8523
    id: rtc_time
    address: 0x68

  - platform: homeassistant
    # Try to synchronize via network
    on_time_sync:
      then:
        # Update the RTC when the synchronization was successful
        pcf8523.write_time:

output:
  # Activity LED
  - platform: gpio
    pin:
      number: 2
      mode: output
    id: activity_led

sensor:
  # SEN66
  - platform: sen6x
    type: SEN66
    pm_1_0:
      name: ${display_name} PM <1µm Weight concentration
    pm_2_5:
      name: ${display_name} PM <2.5µm Weight concentration
    pm_4_0:
      name: ${display_name} PM <4µm Weight concentration
    pm_10_0:
      name: ${display_name} PM <10µm Weight concentration
    temperature:
      name: ${display_name} SEN Temperature
    humidity:
      name: ${display_name} Humidity
    voc:
      name: ${display_name} VOC
    nox:
      name: ${display_name} NOx
    co2:
      name: ${display_name} Carbon Dioxide
    address: 0x6B
    update_interval: ${sensor_update_time}

  # BMP580
  - platform: bmp280_i2c
    temperature:
      name: ${display_name} Temperature
      oversampling: 16x
    pressure:
      name: ${display_name} Pressure
    address: 0x77
    update_interval: ${sensor_update_time}

  - platform: sen0466
    temperature:
      name: ${display_name} DFRobot Temperature
    carbon_monoxide:
      name: ${display_name} Carbon Monoxide
    address: 0x74
    update_interval: ${sensor_update_time}

  # Uptime sensor
  - platform: uptime
    name: Uptime
    id: uptime_sensor

  # Wifi Signal
  - platform: wifi_signal
    name: "Wifi Signal dB"
    id: wifi_signal_db
    update_interval: ${wifi_update_time}
    entity_category: "diagnostic"

  # Reports the WiFi signal strength in %
  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal"
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: "Signal %"
    entity_category: "diagnostic"
    device_class: ""

# Heartbeat
interval:
  - interval: ${sensor_update_time}
    then:
      - homeassistant.event:
          event: esphome.air_monitor.still_alive
